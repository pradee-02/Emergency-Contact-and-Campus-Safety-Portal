{% extends "base.html" %}

{% block title %}Student Login — CampusSafe{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-5">
        <div class="card modern-card shadow-sm border-0">
            <div class="card-header bg-navy text-white text-center p-4" style="background-color: #0f2744;">
                <i class="bi bi-person-badge-fill text-warning fs-1 mb-2"></i>
                <h4 class="fw-bold mb-1 text-white">Student Login</h4>
                <p class="text-light small mb-0">Sign in to your registered CampusSafe account</p>
            </div>

            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="student@university.edu" value="{{ email or '' }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-teal btn-lg fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </div>

                    <div class="d-flex justify-content-between align-items-center small mt-4 pt-3 border-top">
                        <span class="text-muted">Need an account?</span>
                        <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold text-primary">Register as Student</a>
                    </div>
                </form>
            </div>

            <div class="card-footer bg-light text-center p-3 small text-muted border-top">
                Are you a campus security officer? <a href="{{ url_for('admin_login') }}" class="fw-semibold text-dark text-decoration-underline">Admin Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
