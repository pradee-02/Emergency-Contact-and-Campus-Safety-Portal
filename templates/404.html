{% extends "base.html" %}

{% block title %}404 Page Not Found — CampusSafe{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 text-center">
        <div class="p-4 bg-white rounded-4 shadow-sm border">
            <i class="bi bi-compass text-warning" style="font-size: 5rem;"></i>
            <h1 class="display-5 fw-bold text-navy mt-3">404 Not Found</h1>
            <p class="lead text-muted">The safety page or incident record you are looking for does not exist.</p>
            <p class="small text-secondary mb-4">
                Please double-check the URL or incident reference ID.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('home') }}" class="btn btn-teal"><i class="bi bi-house-door me-1"></i> Return Home</a>
                <a href="{{ url_for('emergency_contacts') }}" class="btn btn-outline-secondary"><i class="bi bi-telephone me-1"></i> Emergency Directory</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
